name: Morning Report

on:
  schedule:
    # KST 06:30 월~금 = UTC 21:30 일~목 (UTC+9)
    - cron: "30 21 * * 0-4"
  push:
    paths:
      - "data/cache/**"   # 데스크톱이 야간선물 갱신 push 시 리포트 재생성
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ_NAME: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # TH_DATA(Obsidian vault, private) 브릿지 — 토큰 미설정/만료여도 Pages 빌드는 계속
        continue-on-error: true
        with:
          repository: kimtaehyeon1002-dotcom/TH_DATA
          token: ${{ secrets.TH_DATA_TOKEN }}
          path: TH_DATA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py morning
        env:
          TH_DATA_DIR: ${{ github.workspace }}/TH_DATA
      # 자산 절대값 평문 유출 최종 방어선(design/20 Phase 8 DoD 1·6 — 전 워크플로 공통 단계).
      # 자산 수집 자체는 데스크톱 전용이지만, 평문이 어느 경로로 docs/에 섞여 들어오든
      # 푸시 직전에 걸러야 하므로 docs를 커밋하는 모든 워크플로가 이 스텝을 갖는다.
      - name: Guard against plaintext asset leakage
        uses: ./.github/actions/guard-plaintext
      # 커밋/푸시는 공용 스크립트로 일원화한다 — main에는 여러 주체(뉴스·매크로·stock·
      # financials cron + 데스크톱 배포 push)가 같은 생성물을 쓰기 때문에 rebase 충돌과
      # non-fast-forward 거부가 정상적으로 발생하고, 그 처리를 워크플로마다 두면 어긋난다.
      - name: Commit & push (pages)
        run: |
          bash scripts/ci_commit_push.sh "chore(morning): report $(TZ=Asia/Seoul date +%Y-%m-%d)"
      - name: Commit & push (TH_DATA vault)
        run: |
          bash scripts/ci_commit_push.sh "bot(vault): morning $(TZ=Asia/Seoul date +%Y-%m-%d)" TH_DATA -A
