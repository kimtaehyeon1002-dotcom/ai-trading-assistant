name: Stock Ranking

on:
  schedule:
    # KR 장중(design/21 §277 "KR 장중 cron 09:00~15:30 KST 30~60분") — 매시 정각, 월~금
    # 09:00~15:00 KST = UTC 00:00~06:00(같은 요일, KST=UTC+9라 날짜 이월 없음)
    - cron: "0 0-6 * * 1-5"
    # KR 마감 1회 — 15:35 KST = UTC 06:35, 월~금
    - cron: "35 6 * * 1-5"
    # US 마감 후 1회(KST 새벽) — 22:00 UTC(EDT 종가+2h/EST 종가+1h 이후로 양쪽 서머타임 모두 커버)
    # = 07:00 KST 다음날, 월~금 UTC 실행이 화~토 07:00 KST에 해당(미국 월~금 장 다음날 새벽)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ_NAME: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # TH_DATA(Obsidian vault, private) 브릿지 — 워치리스트 읽기 전용(이 타깃은 저널을 쓰지
        # 않으므로 push 스텝 없음). stock은 유니버스(TOP30×2 ∪ 테마 ∪ 워치리스트, design/21 §8)에
        # 워치리스트를 병합하므로, checkout이 없으면 관심종목이 유니버스에서 조용히 누락된다.
        # 토큰 미설정/만료여도 Pages 빌드는 계속한다(누락은 Vault Sync=skipped로 드러난다).
        continue-on-error: true
        with:
          repository: kimtaehyeon1002-dotcom/TH_DATA
          token: ${{ secrets.TH_DATA_TOKEN }}
          path: TH_DATA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py stock
        env:
          TH_DATA_DIR: ${{ github.workspace }}/TH_DATA
      # 자산 절대값 평문 유출 최종 방어선(design/20 Phase 8 DoD 1·6 — 전 워크플로 공통 단계).
      # 자산 수집 자체는 데스크톱 전용이지만, 평문이 어느 경로로 docs/에 섞여 들어오든
      # 푸시 직전에 걸러야 하므로 docs를 커밋하는 모든 워크플로가 이 스텝을 갖는다.
      - name: Guard against plaintext asset leakage
        uses: ./.github/actions/guard-plaintext
      # 경합 재시도 + rebase 중간상태 복구 + runlog 누적 보존 (a.build-ci.rebase-conflict-push)
      - name: Commit & push
        uses: ./.github/actions/commit-push
        with:
          message: "chore(stock): update"
          stamp: "+%H:%MZ"
