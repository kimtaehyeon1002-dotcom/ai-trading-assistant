name: Financial Statements

on:
  schedule:
    # 분기 공시 주기 데이터라 일1회면 충분(design/06 §1-5, generators/registry.py 주석 참조)
    # 05:00 KST = 전일 20:00 UTC. stock.yml의 KR 마감 배치(06:35 UTC) 이후에 실행되어야
    # Stock Hub 종가(PER 산출 재료)가 최신 상태다.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ_NAME: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # TH_DATA(Obsidian vault, private) 브릿지 — 워치리스트 읽기 전용(이 타깃은 저널을 쓰지
        # 않으므로 push 스텝 없음). checkout이 없으면 build.py의 Vault Sync가 skipped로 기록돼
        # AI Office에 실제와 다른 상태가 발행된다. 토큰 미설정/만료여도 Pages 빌드는 계속한다.
        continue-on-error: true
        with:
          repository: kimtaehyeon1002-dotcom/TH_DATA
          token: ${{ secrets.TH_DATA_TOKEN }}
          path: TH_DATA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py financials
        env:
          TH_DATA_DIR: ${{ github.workspace }}/TH_DATA
      # 자산 절대값 평문 유출 최종 방어선(design/20 Phase 8 DoD 1·6 — 전 워크플로 공통 단계).
      # 자산 수집 자체는 데스크톱 전용이지만, 평문이 어느 경로로 docs/에 섞여 들어오든
      # 푸시 직전에 걸러야 하므로 docs를 커밋하는 모든 워크플로가 이 스텝을 갖는다.
      - name: Guard against plaintext asset leakage
        uses: ./.github/actions/guard-plaintext
      # 커밋/푸시는 공용 스크립트로 일원화한다 — main에는 여러 주체(뉴스·매크로·stock·
      # financials cron + 데스크톱 배포 push)가 같은 생성물을 쓰기 때문에 rebase 충돌과
      # non-fast-forward 거부가 정상적으로 발생하고, 그 처리를 워크플로마다 두면 어긋난다.
      - name: Commit & push
        run: |
          bash scripts/ci_commit_push.sh "chore(financials): update $(date -u +\%Y-\%m-\%d)"
