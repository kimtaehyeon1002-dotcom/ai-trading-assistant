name: News Center

on:
  schedule:
    # 주말 정지(design/26 §8-6) — KST 토 09:00 = UTC 토 00:00이라 주말이 UTC 요일 0,6과
    # 정확히 일치한다. 월~금(1-5)만 돌리면 KST 월 09:00 ~ 토 08:59가 가동 구간이 된다.
    # 뉴스는 주말에도 속보가 나므로 정지하지 않고 주기만 늦춘다(30분 → 2시간).
    - cron: "*/30 * * * 1-5"   # 평일 30분마다
    - cron: "0 */2 * * 0,6"    # 주말 2시간마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ_NAME: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # TH_DATA(Obsidian vault, private) 브릿지 — 토큰 미설정/만료여도 Pages 빌드는 계속
        continue-on-error: true
        with:
          repository: kimtaehyeon1002-dotcom/TH_DATA
          token: ${{ secrets.TH_DATA_TOKEN }}
          path: TH_DATA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py news
        env:
          TH_DATA_DIR: ${{ github.workspace }}/TH_DATA
      # 자산 절대값 평문 유출 최종 방어선(design/20 Phase 8 DoD 1·6 — 전 워크플로 공통 단계).
      # 자산 수집 자체는 데스크톱 전용이지만, 평문이 어느 경로로 docs/에 섞여 들어오든
      # 푸시 직전에 걸러야 하므로 docs를 커밋하는 모든 워크플로가 이 스텝을 갖는다.
      - name: Guard against plaintext asset leakage
        uses: ./.github/actions/guard-plaintext
      # 경합 재시도 + rebase 중간상태 복구 + runlog 누적 보존 (a.build-ci.rebase-conflict-push)
      - name: Commit & push
        uses: ./.github/actions/commit-push
        with:
          message: "chore(news): update"
          stamp: "+%H:%MZ"
          vault-message: "bot(vault): news"
