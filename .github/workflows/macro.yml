name: Macroeconomics

on:
  schedule:
    # 주말 정지(design/26 §8-6) — KST 토 09:00 = UTC 토 00:00이라 주말이 UTC 요일 0,6과
    # 정확히 일치한다. 월~금(1-5)만 돌리면 KST 월 09:00 ~ 토 08:59가 가동 구간이 된다.
    # FRED·ECOS는 주말 발표가 없다(BTC는 24h지만 주말 갱신을 포기하는 대가로 잡음을 줄인다).
    - cron: "0 * * * 1-5"   # 매시 정각, 월~금(UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ_NAME: Asia/Seoul
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # TH_DATA(Obsidian vault, private) 브릿지 — 워치리스트 읽기 전용(이 타깃은 저널을 쓰지
        # 않으므로 push 스텝 없음). checkout이 없으면 build.py의 Vault Sync가 skipped로 기록돼
        # AI Office에 실제와 다른 상태가 발행된다. 토큰 미설정/만료여도 Pages 빌드는 계속한다.
        continue-on-error: true
        with:
          repository: kimtaehyeon1002-dotcom/TH_DATA
          token: ${{ secrets.TH_DATA_TOKEN }}
          path: TH_DATA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py macro
        env:
          TH_DATA_DIR: ${{ github.workspace }}/TH_DATA
      # 자산 절대값 평문 유출 최종 방어선(design/20 Phase 8 DoD 1·6 — 전 워크플로 공통 단계).
      # 자산 수집 자체는 데스크톱 전용이지만, 평문이 어느 경로로 docs/에 섞여 들어오든
      # 푸시 직전에 걸러야 하므로 docs를 커밋하는 모든 워크플로가 이 스텝을 갖는다.
      - name: Guard against plaintext asset leakage
        uses: ./.github/actions/guard-plaintext
      # 경합 재시도 + rebase 중간상태 복구 + runlog 누적 보존 (a.build-ci.rebase-conflict-push)
      - name: Commit & push
        uses: ./.github/actions/commit-push
        with:
          message: "chore(macro): update"
          stamp: "+%H:%MZ"
