<!DOCTYPE html>
<!--
  chart-lab.html — 차트 디자인 확인용 임시 페이지(커밋 대상 아님).

  Asset·Portfolio는 패스프레이즈 게이트 뒤라 로컬에서 실데이터로 렌더할 수 없다. 그래서
  같은 CSS·같은 chart.js에 **모양이 같은 가짜 데이터**를 물려 자산 추이·배분 바·목표 바를
  눈으로 확인한다. 데이터만 가짜고 렌더 경로는 실제와 동일하다.
  확인 후 삭제: rm docs/chart-lab.html
-->
<html lang="ko" data-theme="dark" data-updown="kr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chart Lab · 차트 디자인 확인</title>
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base_v2.css">
  <link rel="stylesheet" href="static/css/components.css">
  <style>
    /* 실 페이지의 body.v2는 사이드바+헤더 그리드다 — 랩에는 셸이 없으니 그 배치만 해제한다
       (폰트·색 등 나머지 body.v2 규칙은 그대로 상속받아야 렌더가 실제와 같다). */
    body.v2 { display: block; padding: 32px; background: var(--surface-base); }
    .lab { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--layout-grid-gutter); align-items: start; }
    .lab h1 { color: var(--text-primary); font-size: var(--type-h1-size); grid-column: 1 / -1; margin: 0 0 8px; }
    .lab p.note { grid-column: 1 / -1; color: var(--text-tertiary); font-size: var(--type-caption-size); margin: 0 0 8px; }
  </style>
</head>
<body class="v2">
<div class="lab">
  <h1>Chart Lab</h1>
  <p class="note">가짜 데이터 · 실제 CSS/chart.js. 선 위에 마우스를 올리거나 차트에 포커스 후 ←/→ 로 확인하세요.</p>

  <!-- ① 자산 추이(full) — 축·격자·목표 참조선·고저 마커 -->
  <div class="v2-card v2-card--standard v2-span-8">
    <div class="v2-card__header">
      <h3 class="v2-card__title">자산 추이</h3>
      <div class="v2-filterbar">
        <button type="button" class="v2-filter-chip" aria-pressed="false">1M</button>
        <button type="button" class="v2-filter-chip" aria-pressed="true">3M</button>
        <button type="button" class="v2-filter-chip" aria-pressed="false">6M</button>
        <button type="button" class="v2-filter-chip" aria-pressed="false">1Y</button>
        <button type="button" class="v2-filter-chip" aria-pressed="false">ALL</button>
      </div>
    </div>
    <div class="v2-card__body">
      <div class="v2-chart-legend" id="legend"></div>
      <div class="v2-chart" id="trend"></div>
    </div>
  </div>

  <!-- ② 목표 달성률 -->
  <div class="v2-card v2-card--standard v2-span-4">
    <div class="v2-card__header"><h3 class="v2-card__title">목표 달성률</h3></div>
    <div class="v2-card__body">
      <div class="v2-stat__value--display">62.4%</div>
      <div class="v2-goal-bar"><div class="v2-goal-bar__fill" style="width:62.4%"></div></div>
      <div class="v2-kv-row"><span class="v2-kv-row__k">현재</span><span class="v2-kv-row__v">1억 8,720만</span></div>
      <div class="v2-kv-row"><span class="v2-kv-row__k">목표</span><span class="v2-kv-row__v">3억</span></div>
      <div class="v2-insight-dot">월평균 420만 순증 유지 시 2028/05 달성 예상</div>
    </div>
  </div>

  <!-- ③ 자산 배분 스택 바 -->
  <div class="v2-card v2-card--standard v2-span-8">
    <div class="v2-card__header"><h3 class="v2-card__title">자산 배분</h3><span class="v2-card__meta">계좌별 비중</span></div>
    <div class="v2-card__body">
      <div class="v2-alloc-bar">
        <div class="v2-alloc-bar__seg" style="width:41.2%;background:var(--chart-series-1)" title="키움 41.2%"><span class="v2-alloc-bar__seglabel">41%</span></div>
        <div class="v2-alloc-bar__seg" style="width:28.5%;background:var(--chart-series-2)" title="한투 ISA 28.5%"><span class="v2-alloc-bar__seglabel">29%</span></div>
        <div class="v2-alloc-bar__seg" style="width:21.1%;background:var(--chart-series-3)" title="한투 위탁 21.1%"><span class="v2-alloc-bar__seglabel">21%</span></div>
        <div class="v2-alloc-bar__seg" style="width:9.2%;background:var(--chart-series-4)" title="BYBIT 9.2%"></div>
      </div>
      <div class="v2-alloc-legend">
        <span class="v2-alloc-legend__item"><span class="v2-alloc-legend__chip" style="background:var(--chart-series-1)"></span>키움 <span class="v2-alloc-legend__pct">41.2%</span></span>
        <span class="v2-alloc-legend__item"><span class="v2-alloc-legend__chip" style="background:var(--chart-series-2)"></span>한투 ISA <span class="v2-alloc-legend__pct">28.5%</span></span>
        <span class="v2-alloc-legend__item"><span class="v2-alloc-legend__chip" style="background:var(--chart-series-3)"></span>한투 위탁 <span class="v2-alloc-legend__pct">21.1%</span></span>
        <span class="v2-alloc-legend__item"><span class="v2-alloc-legend__chip" style="background:var(--chart-series-4)"></span>BYBIT <span class="v2-alloc-legend__pct">9.2%</span></span>
      </div>
    </div>
  </div>

  <!-- ④ Hero 스파크라인(spark) -->
  <div class="v2-card v2-card--standard v2-span-4">
    <div class="v2-card__header"><h3 class="v2-card__title">Hero 스파크라인</h3></div>
    <div class="v2-card__body">
      <div class="v2-stat__value--display">1억 8,720만</div>
      <div class="v2-updown up">▲ +1.24% 전일 스냅샷 대비</div>
      <div class="v2-chart" id="hero" style="margin-top:16px"></div>
    </div>
  </div>

  <!-- ⑤ Macro 마이크로 타일 -->
  <div class="v2-card v2-card--standard v2-span-12">
    <div class="v2-card__header"><h3 class="v2-card__title">Macro 마이크로 타일</h3><span class="v2-card__meta">차트 최근 1개월</span></div>
    <div class="v2-card__body">
      <div class="v2-macro-groups" id="tiles"></div>
    </div>
  </div>
</div>

<script src="static/js/chart.js" defer></script>
<script>
(function () {
  // 결정적 가짜 시계열(난수 시드 고정) — 새로고침해도 같은 그림이라 눈으로 비교가 된다.
  function series(n, start, drift, vol, seed) {
    var s = seed, out = [], v = start;
    for (var i = 0; i < n; i++) {
      s = (s * 1103515245 + 12345) % 2147483648;
      v = v * (1 + drift + ((s / 2147483648) - 0.5) * vol);
      out.push(v);
    }
    return out;
  }
  function dates(n) {
    var out = [], d = new Date(2026, 7, 3);
    for (var i = n - 1; i >= 0; i--) {
      var x = new Date(d.getTime() - i * 86400000);
      out.push(x.getFullYear() + "-" + ("0" + (x.getMonth() + 1)).slice(-2) + "-" + ("0" + x.getDate()).slice(-2));
    }
    return out;
  }
  function compact(v) {
    var a = Math.abs(v);
    if (a >= 1e8) return (a / 1e8).toFixed(2).replace(/\.?0+$/, "") + "억";
    return Math.round(a / 1e4).toLocaleString("ko-KR") + "만";
  }

  var N = 90;
  var assets = series(N, 1.55e8, 0.0022, 0.014, 7);
  var d = dates(N);
  var lo = Math.min.apply(null, assets), hi = Math.max.apply(null, assets);
  var pct = (assets[N - 1] / assets[0] - 1) * 100;

  document.getElementById("legend").innerHTML =
    '<span class="v2-chart-legend__item"><span class="v2-chart-legend__k">구간</span><span class="v2-chart-legend__v">'
    + d[0] + " → " + d[N - 1] + " (" + N + '일)</span></span>'
    + '<span class="v2-chart-legend__item"><span class="v2-chart-legend__k">구간 등락</span><span class="v2-chart-legend__v v2-updown up">▲ +'
    + pct.toFixed(2) + '%</span></span>'
    + '<span class="v2-chart-legend__item"><span class="v2-chart-legend__k">최고</span><span class="v2-chart-legend__v">' + compact(hi) + '</span></span>'
    + '<span class="v2-chart-legend__item"><span class="v2-chart-legend__k">최저</span><span class="v2-chart-legend__v">' + compact(lo) + '</span></span>'
    + '<span class="v2-chart-legend__item"><span class="v2-chart-legend__key v2-chart-legend__key--dash"></span><span class="v2-chart-legend__k">목표</span><span class="v2-chart-legend__v">3억</span></span>';

  document.getElementById("trend").setAttribute("data-chart", JSON.stringify({
    values: assets, dates: d, variant: "full", color: "direction", format: "krw",
    refs: [{ value: 3e8, label: "목표 3억" }], label: "총자산 추이", height: 240
  }));
  document.getElementById("hero").setAttribute("data-chart", JSON.stringify({
    values: assets.slice(-30), dates: d.slice(-30), variant: "spark", color: "direction",
    format: "krw", label: "총자산 최근 추이", height: 56
  }));

  var TILES = [
    ["환율·달러", [["USD/KRW 환율", 1430, -0.0018, 0.006, 3, "KRW"], ["달러인덱스", 99.8, -0.0004, 0.004, 11, "pt"], ["USD/JPY", 156.9, -0.0012, 0.005, 19, "JPY"]]],
    ["금리·변동성", [["미국 10년물 국채금리", 4.74, 0.0026, 0.012, 23, "%"], ["미국 30년물 국채금리", 5.27, 0.0022, 0.010, 29, "%"], ["VIX", 16.0, 0.0008, 0.035, 31, "pt"]]],
    ["원자재", [["WTI 유가", 71.2, 0.0012, 0.016, 37, "USD"], ["금", 3120, 0.0018, 0.009, 41, "USD"], ["천연가스", 3.42, -0.0031, 0.041, 43, "USD"]]]
  ];
  document.getElementById("tiles").innerHTML = TILES.map(function (g) {
    return '<section class="v2-macro-group"><div class="v2-overline">' + g[0] + '</div><div class="v2-macro-strip">'
      + g[1].map(function (t) {
        var vals = series(22, t[1], t[2], t[3], t[4]);
        var chg = (vals[21] / vals[0] - 1) * 100;
        var cls = chg >= 0 ? "up" : "down";
        return '<div class="v2-macro-tile"><div class="v2-macro-tile__head">'
          + '<div class="v2-macro-tile__label">' + t[0] + '</div>'
          + '<div class="v2-macro-tile__value">' + vals[21].toFixed(t[1] > 1000 ? 1 : 2) + (t[5] === "%" ? "%" : "") + '</div>'
          + '<div class="v2-macro-tile__rates"><span class="v2-updown ' + cls + '">' + (chg >= 0 ? "▲ +" : "▼ ") + (chg / 4).toFixed(2)
          + '%</span><span class="v2-macro-tile__period"><span class="k">1M</span> <span class="v2-updown ' + cls + '">'
          + (chg >= 0 ? "▲ +" : "▼ ") + chg.toFixed(2) + '%</span></span></div></div>'
          + '<div class="v2-macro-tile__spark"><div class="v2-chart" data-chart=\'' + JSON.stringify({
            values: vals, dates: dates(22), variant: "spark", color: "direction", unit: t[5],
            label: t[0] + " 최근 1개월 추이", height: 56
          }).replace(/'/g, "&#39;") + '\'></div></div></div>';
      }).join("") + "</div></section>";
  }).join("");

  function boot() { if (window.TAChart) window.TAChart.initAll(document); else setTimeout(boot, 30); }
  boot();
})();
</script>
</body>
</html>
